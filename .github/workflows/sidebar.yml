name: Generate Sidebar

on:
  push:
    branches: [ main ]
    paths:
      - 'spec/**'
      - 'docs/**'
      - 'scripts/generate_sidebar.py'
  workflow_dispatch:                 # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0            # needed for clean git history & push

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install script dependencies (if any)
        run: |
          python -m pip install --quiet --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          # Most likely you only need stdlib → nothing to install

      - name: Generate sidebar
        run: python3 scripts/generate_sidebar.py

      - name: Create Pull Request with updated sidebar
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/sidebar
          delete-branch: true
          title: 'chore(docs): regenerate sidebar'
          body: 'Automated run of `scripts/generate_sidebar.py`'
          commit-message: 'chore(docs): regenerate sidebar [ci skip]'
          labels: documentation,automated

      - name: Success summary
        if: success()
        run: |
          echo "### Sidebar auto-updated" >> $GITHUB_STEP_SUMMARY
          echo "- File: docs/_includes/sidebar.html" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- PR outcome: ${{ steps.cpr.outcome }}" >> $GITHUB_STEP_SUMMARY
