name: Generate Sidebar

on:
  push:
    branches: [ main ]
    paths:
      - 'spec/**'
      - 'docs/**'
      - 'scripts/generate_sidebar.py'
      - '!docs/_includes/sidebar.html'
  workflow_dispatch:                 # allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0            # needed for clean git history & push

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install script dependencies (if any)
        run: |
          python -m pip install --quiet --upgrade pip
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          # Most likely you only need stdlib → nothing to install

      - name: Generate sidebar
        run: python3 scripts/generate_sidebar.py

      - name: Create Pull Request with updated sidebar
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/sidebar
          delete-branch: true
          title: 'chore(docs): regenerate sidebar'
          body: 'Automated run of `scripts/generate_sidebar.py`'
          commit-message: 'chore(docs): regenerate sidebar [ci skip]'
          labels: documentation,automated

      - name: Success summary
        if: success()
        run: |
          {
            echo "### Sidebar auto-updated"
            echo "- File: docs/_includes/sidebar.html"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- PR outcome: ${{ steps.cpr.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
