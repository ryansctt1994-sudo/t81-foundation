# .github/workflows/build-search-index.yml
name: Build Search Index (PR-based)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/search/**'
      - 'docs/**'
      - 'spec/**'
      - '!docs/search/search_index.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Cheerio & Lunr (in docs/search)
        working-directory: docs/search
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install cheerio@1.0.0-rc.12 lunr@2.3.9
          fi

      - name: Build search index
        working-directory: docs/search
        run: node build_index.js

      - name: Create Pull Request with updated index
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/search-index
          delete-branch: true
          title: 'chore(docs): regenerate search index'
          body: 'Automated run of `docs/search/build_index.js`'
          commit-message: 'chore(docs): update search_index.json [ci skip]'
          labels: documentation,automated

      - name: Workflow summary
        if: always()
        run: |
          {
            echo "### Search index automation"
            echo "- PR step outcome: ${{ steps.cpr.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
