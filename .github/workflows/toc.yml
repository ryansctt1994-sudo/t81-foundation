name: Inject TOCs

on:
  push:
    branches: [ main ]
    paths:
      - 'spec/**/*.md'
      - 'docs/**/*.md'
      - 'scripts/inject_toc.py'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  inject-toc:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0                      # required for git push

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install TOC script dependencies (if any)
        run: |
          python -m pip install --quiet --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install --quiet -r requirements.txt
          fi
          # inject_toc.py likely uses only stdlib → nothing needed

      - name: Inject Table of Contents into Markdown files
        run: python3 scripts/inject_toc.py

      - name: Create Pull Request with TOC updates
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/toc-refresh
          delete-branch: true
          title: "chore(docs): regenerate Tables of Contents"
          body: "Automated run of `scripts/inject_toc.py`."
          commit-message: "chore(docs): regenerate Tables of Contents [ci skip]"
          labels: documentation,automated

      - name: Success summary
        if: success()
        run: |
          {
            echo "### Tables of Contents auto-updated"
            echo "- Files processed by scripts/inject_toc.py"
            echo "- Trigger: ${{ github.event_name }}"
          } >> "$GITHUB_STEP_SUMMARY"
