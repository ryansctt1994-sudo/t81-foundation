name: Tritwise Determinism Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tritwise-compliance:
    name: " Compliance / Ubuntu (AVX2 + ASAN + Determinism) "
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build python3

      - name: Configure CMake (ASAN/UBSAN)
        run: |
          cmake -S . -B build_asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DT81_BUILD_BENCHMARKS=ON \
            -DT81_BUILD_TESTS=ON \
            -DT81_ENABLE_ASAN=ON \
            -DT81_ENABLE_UBSAN=ON \
            -DCMAKE_CXX_FLAGS="-mavx2 -mfma"

      - name: Build
        run: cmake --build build_asan --target t81_tritwise_backend_equivalence_test benchmark_runner --parallel

      - name: Run Equivalence Tests (ASAN)
        run: ./build_asan/t81_tritwise_backend_equivalence_test

      - name: Run Benchmark Smoke Test
        # Run a small subset to ensure no crashes under ASAN
        run: |
          ./build_asan/benchmarks/benchmark_runner \
            --benchmark_filter="BM_MaskApply_Library/256" \
            --benchmark_min_time=0.01

  tritwise-determinism-no-simd:
    name: " Compliance / No-SIMD Fallback "
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Configure CMake (No AVX2)
        run: |
          cmake -S . -B build_nosimd -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DT81_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build_nosimd --target t81_tritwise_backend_equivalence_test --parallel

      - name: Run Equivalence Tests
        run: ./build_nosimd/t81_tritwise_backend_equivalence_test
